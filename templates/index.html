<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Panel - Order System</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 400px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 10px; width: 100%; margin-top: 15px; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #218838; }
        #response-message { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>অর্ডার করুন</h2>
    <form id="orderForm">
        <label for="service">সার্ভিস আইডি:</label>
        <input type="text" id="service" name="service" placeholder="সার্ভিস আইডি দিন" required>

        <label for="link">লিংক (Profile/Post Link):</label>
        <input type="text" id="link" name="link" placeholder="https://..." required>

        <label for="quantity">পরিমাণ (Quantity):</label>
        <input type="number" id="quantity" name="quantity" placeholder="যেমন: 1000" required>

        <button type="submit">অর্ডার সাবমিট করুন</button>
    </form>
    <div id="response-message"></div>
</div>

<script>
    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = new URLSearchParams(new FormData(this));
        const msgDiv = document.getElementById('response-message');
        msgDiv.style.color = "blue";
        msgDiv.innerText = "অর্ডার প্রসেস হচ্ছে, দয়া করে অপেক্ষা করুন...";

        try {
            const response = await fetch('/api/order', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();

            if (result.order) {
                msgDiv.style.color = "green";
                msgDiv.innerText = "সফল! অর্ডার আইডি: " + result.order;
            } else {
                msgDiv.style.color = "red";
                msgDiv.innerText = "ত্রুটি: " + (result.message || "অর্ডার সম্পন্ন হয়নি!");
            }
        } catch (err) {
            msgDiv.style.color = "red";
            msgDiv.innerText = "সার্ভার কানেকشنে সমস্যা হয়েছে!";
        }
    });
</script>

</body>
</html>
